name: mcfunction Lint

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.mcfunction'
      - '**/*.json'
      - '.github/workflows/mcfunction-lint.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.mcfunction'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # 1. Hızlı Shell/Regex Kontrolleri (Tek Paralel Job)
  # ─────────────────────────────────────────────
  static-analysis:
    name: Static Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: CRLF Check
        run: |
          echo "::group::CRLF Line Ending Scan"
          FAILED=0
          while IFS= read -r f; do
            if file "$f" | grep -q "CRLF"; then
              echo "::error file=$f,title=CRLF Detected::File has CRLF line endings. Run dos2unix."
              FAILED=1
            fi
          done < <(find data -name "*.mcfunction" 2>/dev/null)
          echo "::endgroup::"
          [ $FAILED -ne 0 ] && exit 1 || echo "PASSED: No CRLF line endings found."

      - name: Macro Line Prefix Check
        run: |
          echo "::group::Macro Prefix ($) Scan"
          FAILED=0
          while IFS= read -r f; do
            lineno=0
            while IFS= read -r line; do
              lineno=$((lineno + 1))
              stripped=$(echo "$line" | sed 's/^[[:space:]]*//')
              [[ "$stripped" == "#"* || -z "$stripped" ]] && continue
              if echo "$line" | grep -qP '\$\([a-zA-Z_][a-zA-Z0-9_]*\)'; then
                if ! echo "$line" | grep -qP '^\s*\$'; then
                  echo "::error file=$f,line=$lineno,title=Missing Macro Prefix::Macro variable \$(var) used on non-macro line."
                  FAILED=1
                fi
              fi
            done < "$f"
          done < <(find data -name "*.mcfunction" 2>/dev/null)
          echo "::endgroup::"
          [ $FAILED -ne 0 ] && exit 1 || echo "PASSED: All macro variables on correct lines."

      - name: INPUT Comment & @p Selector Checks
        run: |
          echo "::group::Code Quality & Best Practices Scan"
          while IFS= read -r f; do
            # INPUT comment check
            has_macro=$(grep -cP '^\$' "$f") || has_macro=0
            has_input=$(grep -cP '^# INPUT:' "$f") || has_input=0
            if [ "${has_macro:-0}" -gt 0 ] && [ "${has_input:-0}" -eq 0 ]; then
              echo "::warning file=$f,title=Missing INPUT Comment::File uses macro variables (\$) but lacks '# INPUT:' documentation header."
            fi

            # @p selector check
            lineno=0
            while IFS= read -r line; do
              lineno=$((lineno + 1))
              stripped=$(echo "$line" | sed 's/^[[:space:]]*//')
              [[ "$stripped" == "#"* || -z "$stripped" ]] && continue
              if echo "$line" | grep -qP '@p\b'; then
                echo "::warning file=$f,line=$lineno,title=Avoid @p Selector::Use @a[name=\$(player),limit=1] or context-bound selectors instead of @p."
              fi
            done < "$f"
          done < <(find data -name "*.mcfunction" 2>/dev/null)
          echo "::endgroup::"

      - name: Trailing Whitespace Check
        run: |
          echo "::group::Trailing Whitespace Scan"
          while IFS= read -r f; do
            lineno=0
            while IFS= read -r line; do
              lineno=$((lineno + 1))
              if echo "$line" | grep -qP '\s+$'; then
                echo "::warning file=$f,line=$lineno,title=Trailing Whitespace::Line contains trailing spaces or tabs."
              fi
            done < "$f"
          done < <(find data -name "*.mcfunction" 2>/dev/null)
          echo "::endgroup::"

  # ─────────────────────────────────────────────
  # 2. Mecha Validation (Cached Python Environment)
  # ─────────────────────────────────────────────
  mecha-lint:
    name: Mecha AST Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          echo "::group::Pip Package Installation"
          python -m pip install --upgrade pip
          pip install mecha
          echo "::endgroup::"

      - name: Run Mecha Validator
        run: |
          echo "::group::AST & Syntax Validation"
          mecha .
          echo "::endgroup::"
