name: Release and Publish Datapack

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g., v1.0.0 or 1.0.0)"
        required: true
        type: string
      release_type:
        description: "Release Type"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - beta
          - alpha
      changelog:
        description: "Changelog / Release Notes"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Package & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Version Parsing
        id: prep
        run: |
          C_CYAN="\033[36m\033[1m"
          C_YELLOW="\033[33m"
          C_GREEN="\033[32m"
          C_RESET="\033[0m"

          RAW_VER="${{ github.event.inputs.version }}"
          CLEAN_VER="${RAW_VER#v}"
          TAG_NAME="v${CLEAN_VER}"

          echo "clean_version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "zip_name=datapack-${TAG_NAME}.zip" >> $GITHUB_OUTPUT

          echo -e "${C_CYAN}Target Version:${C_RESET} ${C_YELLOW}${CLEAN_VER}${C_RESET}"
          echo -e "${C_CYAN}Target Tag:${C_RESET}     ${C_GREEN}${TAG_NAME}${C_RESET}"

      - name: Update pack.mcmeta
        run: |
          CLEAN_VER="${{ steps.prep.outputs.clean_version }}"
          if [ -f "pack.mcmeta" ]; then
            jq --arg ver "$CLEAN_VER" '.pack.version = $ver' pack.mcmeta > temp.json || jq '.' pack.mcmeta > temp.json
            mv temp.json pack.mcmeta
            echo -e "\033[32m✔ Updated pack.mcmeta version to \033[1m${CLEAN_VER}\033[0m"
          else
            echo -e "\033[33m\033[3m⚠ pack.mcmeta not found, skipping version injection.\033[0m"
          fi

      - name: Packaging Zip & SHA256
        id: hash
        run: |
          ZIP_NAME="${{ steps.prep.outputs.zip_name }}"
          
          echo -e "\033[34mZipping datapack contents...\033[0m"
          zip -r "$ZIP_NAME" pack.mcmeta data/ assets/ LICENSE README.md -x "*.git*" ".github/*"
          
          echo -e "\033[34mGenerating SHA-256 checksum...\033[0m"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          
          # Hashing değerini oku ve step output'a aktar
          SHA_VAL=$(cat "${ZIP_NAME}.sha256")
          echo "sha256_text=${SHA_VAL}" >> $GITHUB_OUTPUT
          echo -e "\033[2m${SHA_VAL}\033[0m"

      - name: Git Operations
        run: |
          TAG_NAME="${{ steps.prep.outputs.tag_name }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo -e "\033[34mStaging modified files...\033[0m"
          git add pack.mcmeta
          git diff --cached --quiet || git commit -m "chore(release): prepare release ${TAG_NAME} [skip ci]"
          
          echo -e "\033[32m\033[1mCreating git tag: ${TAG_NAME}\033[0m"
          git tag -a "${TAG_NAME}" -m "Release ${TAG_NAME}"
          git push origin HEAD --follow-tags

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.prep.outputs.tag_name }}-package
          path: |
            ${{ steps.prep.outputs.zip_name }}
            ${{ steps.prep.outputs.zip_name }}.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.prep.outputs.tag_name }}
          name: "Release ${{ steps.prep.outputs.tag_name }}"
          body: |
            ${{ github.event.inputs.changelog || 'No changelog provided.' }}

            ### SHA-256 Checksum
            ```
            ${{ steps.hash.outputs.sha256_text }}
            ```
          prerelease: ${{ github.event.inputs.release_type != 'release' }}
          files: |
            ${{ steps.prep.outputs.zip_name }}
            ${{ steps.prep.outputs.zip_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
